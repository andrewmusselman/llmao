# litellm proxy configuration for llmao — GENERATED from llmao/catalog.py.
# Edit the catalog, then re-run scripts/render_litellm_config.py.

model_list:
  - model_name: selfhost/gemma4-26b
    litellm_params:
      model: openai/gemma4-26b
      api_base: os.environ/LLMAO_SELFHOST_GEMMA_URL
      api_key: os.environ/LLMAO_SELFHOST_API_KEY
  - model_name: selfhost/qwen3.6-27b
    litellm_params:
      model: openai/qwen3.6-27b
      api_base: os.environ/LLMAO_SELFHOST_QWEN_CODER_URL
      api_key: os.environ/LLMAO_SELFHOST_API_KEY
  - model_name: selfhost/qwen3-8b
    litellm_params:
      model: openai/qwen3-8b
      api_base: os.environ/LLMAO_SELFHOST_QWEN8B_URL
      api_key: os.environ/LLMAO_SELFHOST_API_KEY
  - model_name: anthropic/claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: bedrock/anthropic.claude-sonnet-4-5
    litellm_params:
      model: bedrock/anthropic.claude-sonnet-4-5
      api_key: os.environ/AWS_BEARER_TOKEN_BEDROCK

litellm_settings:
  drop_params: true
  success_callback: ["litellm_spend_logs"]

general_settings:
  master_key: os.environ/LLMAO_LITELLM_MASTER_KEY
